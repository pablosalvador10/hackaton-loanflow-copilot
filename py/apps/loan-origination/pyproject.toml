[project]
name = "loan-origination"
version = "0.1.0"
description = "Loan Origination — Foundry agent that guides mortgage applicants through document upload, extraction, and pre-approval."
requires-python = ">=3.11"
dependencies = [
    "foundrykit",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.29,<1.34",
    "opentelemetry-sdk>=1.29,<1.34",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<0.55b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<1.34",
    "azure-monitor-opentelemetry-exporter>=1.0.0b33,<=1.0.0b34",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.17.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
foundrykit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "models", "services", "tools", "prompts"]

# ── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
