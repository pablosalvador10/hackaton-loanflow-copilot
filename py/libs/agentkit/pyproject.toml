[project]
name = "agentkit"
version = "0.1.0"
description = "YAML-driven multi-agent framework with tool registry, Jinja2 prompts, handoff orchestration, and Chat Completions support."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.58",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

# ── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
