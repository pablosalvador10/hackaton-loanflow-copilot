[project]
name = "foundrykit"
version = "0.1.0"
description = "Reusable wrapper around Azure AI Foundry SDK — client, tool registry, and agent lifecycle helpers."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-agents>=1.2.0b3,<2.0.0",
    "azure-identity>=1.19",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.29",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundrykit"]

# ── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
